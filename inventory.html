<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tồn kho - Vinh Lab 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #333; text-align: center; margin-bottom: 15px; font-size: 20px;}
        
        .search-box { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; width: 100%; }
        .input-group label { font-size: 12px; font-weight: bold; color: #007bff; margin-bottom: 4px; text-transform: uppercase; }
        
        input, select { padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; outline: none; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: #007bff; background: #f0f7ff; }

        /* Vùng lọc ComboBox - Ẩn khi chưa có dữ liệu */
        #filterArea { display: none; flex-direction: column; gap: 12px; background: #eef6ff; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #d0e3ff; }

        /* Bảng dữ liệu */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background-color: #007bff; color: white; padding: 10px; font-size: 12px; }
        td { border-bottom: 1px solid #eee; padding: 12px 8px; font-size: 15px; text-align: center; }
        
        .qty-cell { font-weight: bold; color: #d32f2f; font-size: 18px !important; }
        .status { margin-top: 15px; font-size: 13px; text-align: center; color: #666; }

        /* Responsive Mobile */
        @media screen and (max-width: 600px) {
            table thead { display: none; }
            table tr { display: block; margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; padding: 10px; position: relative; background: white;}
            table td { display: block; text-align: left; padding: 4px 0; border: none; }
            table td::before { font-weight: bold; color: #888; margin-right: 5px; display: inline-block; width: 65px; }
            table td:nth-of-type(1)::before { content: "Store:"; }
            table td:nth-of-type(2)::before { content: "Item:"; }
            table td:nth-of-type(3)::before { content: "Size:"; }
            .qty-cell { position: absolute; right: 10px; top: 10px; color: #d32f2f; }
            .qty-cell::before { content: ""; display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 QUẢN LÝ TỒN KHO</h2>
    
    <div class="search-box">
        <div class="input-group">
            <label>1. Nhập Item No (Ấn Enter)</label>
            <input type="text" id="itemInput" placeholder="Ví dụ: HM2111..." onkeypress="handleItemKeyPress(event)">
        </div>
    </div>

    <div id="filterArea">
        <div class="input-group">
            <label>2. Lọc theo Store</label>
            <select id="storeFilter" onchange="runFilter()">
                <option value="all">--- Tất cả Store ---</option>
            </select>
        </div>
        <div class="input-group">
            <label>3. Lọc theo Size</label>
            <select id="sizeFilter" onchange="runFilter()">
                <option value="all">--- Tất cả Size ---</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Store</th>
                    <th>ItemNo</th>
                    <th>Size</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4" style="color:#999; padding: 30px;">Nhập mã và Enter để lấy dữ liệu</td></tr>
            </tbody>
        </table>
    </div>
    
    <div id="statusMessage" class="status">Sẵn sàng tra cứu.</div>
</div>

<script>
let masterData = []; // Két sắt giữ dữ liệu gốc từ DB

// Kiểm tra đăng nhập khi mở trang
window.onload = () => {
    if (!localStorage.getItem('userToken')) window.location.href = 'login.html';
    document.getElementById("itemInput").focus();
};

// Bắt sự kiện Enter tại ô Item
function handleItemKeyPress(event) {
    if (event.key === "Enter") {
        fetchDataFromDB();
    }
}

// --- HÀM 1: TRUY VẤN DATABASE ---
async function fetchDataFromDB() {
    const token = localStorage.getItem('userToken');
    const itemNo = document.getElementById("itemInput").value.trim();
    const statusMsg = document.getElementById("statusMessage");

    if (itemNo.length < 3) {
        alert("Vinh ơi, nhập ít nhất 3 ký tự nhé!");
        return;
    }

    statusMsg.innerHTML = "🔄 Đang tải dữ liệu từ Database...";
    
    try {
        const url = `https://api.vinh-lab-2026.online/api/inventory?itemNo=${encodeURIComponent(itemNo)}`;
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });

        if (res.status === 401) {
            alert("Hết hạn đăng nhập!");
            window.location.href = 'login.html';
            return;
        }

        const data = await res.json();
        masterData = data; // Lưu vào biến gốc

        if (!data || data.length === 0) {
            document.getElementById("filterArea").style.display = "none";
            renderTable([]);
            statusMsg.innerHTML = "❌ Không tìm thấy mã hàng này.";
        } else {
            // Hiện vùng lọc và nạp dữ liệu vào ComboBox
            document.getElementById("filterArea").style.display = "flex";
            setupComboBoxes(data);
            renderTable(data); // Hiện toàn bộ kết quả ban đầu
            statusMsg.innerHTML = `✅ Đã tải ${data.length} dòng. Mời bạn chọn Store hoặc Size để lọc.`;
        }
    } catch (err) {
        statusMsg.innerHTML = "⚠️ Lỗi kết nối API!";
    }
}

// --- HÀM 2: TRÍCH XUẤT UNIQUE DATA CHO COMBOBOX ---
function setupComboBoxes(data) {
    const storeSelect = document.getElementById("storeFilter");
    const sizeSelect = document.getElementById("sizeFilter");

    // Lấy danh sách Store duy nhất
    const uniqueStores = [...new Set(data.map(item => item.store))].sort();
    storeSelect.innerHTML = '<option value="all">--- Tất cả Store ---</option>';
    uniqueStores.forEach(s => {
        storeSelect.innerHTML += `<option value="${s}">${s}</option>`;
    });

    // Lấy danh sách Size duy nhất
    const uniqueSizes = [...new Set(data.map(item => item.size))].sort();
    sizeSelect.innerHTML = '<option value="all">--- Tất cả Size ---</option>';
    uniqueSizes.forEach(sz => {
        sizeSelect.innerHTML += `<option value="${sz}">${sz}</option>`;
    });
}

// --- HÀM 3: LỌC KẾT HỢP (FILTER CUMULATIVE) ---
function runFilter() {
    const selectedStore = document.getElementById("storeFilter").value;
    const selectedSize = document.getElementById("sizeFilter").value;

    const filtered = masterData.filter(item => {
        const matchStore = (selectedStore === "all" || item.store == selectedStore);
        const matchSize = (selectedSize === "all" || item.size == selectedSize);
        return matchStore && matchSize;
    });

    renderTable(filtered);
    document.getElementById("statusMessage").innerHTML = `🔎 Đang hiện ${filtered.length} kết quả phù hợp.`;
}

// --- HÀM 4: VẼ BẢNG ---
function renderTable(data) {
    const tbody = document.querySelector("#inventoryTable tbody");
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Không có dữ liệu phù hợp</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(r => `
        <tr>
            <td>${r.store}</td>
            <td class="item-cell">${r.itemNo}</td>
            <td><span style="background:#eee; padding:2px 8px; border-radius:4px; font-weight:bold;">${r.size}</span></td>
            <td class="qty-cell">${r.qty}</td>
        </tr>
    `).join('');
}
</script>

</body>
</html>
