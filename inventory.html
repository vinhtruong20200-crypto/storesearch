<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tồn kho - Inventory System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; margin-bottom: 25px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        #itemInput { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; outline: none; }
        #itemInput:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
        
        /* Style cho nút Tìm kiếm */
        .btn-search { 
            padding: 0 25px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-search:hover { background-color: #0056b3; }
        .btn-search:active { background-color: #004085; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #eee; padding: 15px; text-align: left; }
        th { background-color: #007bff; color: white; text-transform: uppercase; font-size: 14px; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; transition: 0.3s; }
        
        .status { margin-top: 15px; font-size: 14px; color: #666; }
        .loading { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 ST</h2>
    
    <div class="search-box">
        <input type="text" id="itemInput" placeholder="Nhập mã ItemNo..." onkeypress="handleKeyPress(event)">
        <button class="btn-search" onclick="loadData()">TÌM KIẾM</button>
    </div>

    <table id="inventoryTable">
        <thead>
            <tr>
                <th> Store </th>
                <th>ItemNo</th>
                <th>Size</th>
                <th>Qty</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
    
    <div id="statusMessage" class="status">Nhập mã hàng và nhấn Tìm kiếm.</div>
</div>

<script>
    // Kiểm tra ngay khi vừa vào trang: Nếu không có token, mời đi đăng nhập luôn
window.onload = function() {
    const token = localStorage.getItem('userToken');
    if (!token) {
        alert("Bạn chưa đăng nhập! Vui lòng đăng nhập để sử dụng hệ thống.");
        window.location.href = 'login.html'; // Chuyển hướng về trang login của An
    }
};

function handleKeyPress(event) {
    if (event.key === "Enter") {
        loadData();
    }
}

function loadData() {
    const token = localStorage.getItem('userToken');
    const btn = document.querySelector(".btn-search");
    const itemInput = document.getElementById("itemInput");
    const itemNo = itemInput.value.trim();
    const statusMsg = document.getElementById("statusMessage");
    const tbody = document.querySelector("#inventoryTable tbody");
if (itemNo.length < 3) {
        alert("Vui lòng nhập ít nhất 3 ký tự để tìm kiếm!");
        // Hoặc hiện thông báo nhẹ nhàng lên giao diện:
        // msg.innerText = "Nhập ít nhất 3 ký tự nhé Vinh!";
        return; // Dừng lại luôn, không chạy xuống đoạn gọi API bên dưới
    }
    if (!itemNo) {
        statusMsg.innerHTML = '<span style="color:orange;">⚠️ Vui lòng nhập mã hàng!</span>';
        itemInput.focus();
        return;
    }

    // --- BẮT ĐẦU CHỐNG SPAM ---
    btn.disabled = true;
    const originalText = btn.innerText;
    btn.innerText = "⏳...";
    
    statusMsg.innerHTML = '<span class="loading">🔄 Đang truy vấn Database...</span>';
    tbody.innerHTML = ""; 

    const url = `https://api.vinh-lab-2026.online/api/inventory?itemNo=${encodeURIComponent(itemNo)}`;

    fetch(url, {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token // Gửi chìa khóa đi
        }
    })
    .then(res => {
        // XỬ LÝ LỖI BẢO MẬT (401)
        if (res.status === 401) {
            localStorage.removeItem('userToken'); // Xóa token cũ đã hết hạn
            throw new Error("Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại!");
        }
        if (!res.ok) throw new Error("Lỗi hệ thống hoặc API không phản hồi.");
        return res.json();
    })
    .then(data => {
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">❌ Không tìm thấy mã hàng này</td></tr>';
            statusMsg.innerHTML = "Tìm thấy 0 kết quả.";
        } else {
            let html = "";
            data.forEach(r => {
                html += `<tr>
                            <td> ${r.store} </td>
                            <td><strong>${r.itemNo}</strong></td>
                            <td>${r.size}</td>
                            <td>${r.qty}</td>
                          </tr>`;
            });
            tbody.innerHTML = html;
            statusMsg.innerHTML = `✅ Tìm thấy ${data.length} kết quả.`;
        }
    })
    .catch(err => {
        statusMsg.innerHTML = `<span style="color:red;">⚠️ ${err.message}</span>`;
        // Nếu lỗi do hết hạn thì tự động chuyển hướng sau 2 giây
        if (err.message.includes("đăng nhập lại")) {
            setTimeout(() => window.location.href = 'login.html', 2000);
        }
    })
    .finally(() => {
        setTimeout(() => {
            btn.disabled = false;
            btn.innerText = originalText;
        }, 1500); 
    });
}
</script>

</body>
</html>
