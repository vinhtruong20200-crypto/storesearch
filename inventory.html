<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tồn kho - Inventory System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #333; text-align: center; margin-bottom: 15px; font-size: 20px;}
        
        /* Khu vực nhập liệu 2 ô */
        .search-box { display: flex; gap: 8px; margin-bottom: 10px; }
        #itemInput { flex: 2; padding: 12px; border: 2px solid #007bff; border-radius: 8px; font-size: 16px; outline: none; }
        #sizeInput { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; }
        #sizeInput:focus { border-color: #28a745; }
        
        /* Khu vực lọc Store */
        .filter-box { background: #e9f2ff; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; }
        #storeFilter { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #b6d4fe; font-size: 14px; margin-top: 5px; box-sizing: border-box;}

        /* Bảng dữ liệu */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; background: white; }
        th { background-color: #007bff; color: white; padding: 10px 5px; font-size: 12px; text-transform: uppercase; }
        td { border-bottom: 1px solid #eee; padding: 10px 5px; font-size: 14px; text-align: center; }
        tr:nth-child(even) { background-color: #fafafa; }
        
        .qty-cell { font-weight: bold; color: #d32f2f; font-size: 16px !important; }
        .item-cell { font-weight: 600; color: #333; }

        .status { margin-top: 15px; font-size: 13px; text-align: center; color: #666; }
        .loading { color: #007bff; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Responsive Mobile */
        @media screen and (max-width: 600px) {
            .search-box { flex-direction: row; } /* Giữ nằm ngang trên mobile nếu cần, hoặc column nếu muốn to hơn */
            table thead { display: none; }
            table tr { display: block; margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; padding: 10px; position: relative; }
            table td { display: block; text-align: left; padding: 4px 0; border: none; }
            table td::before { font-weight: bold; color: #888; margin-right: 5px; display: inline-block; width: 60px; }
            table td:nth-of-type(1)::before { content: "Store:"; }
            table td:nth-of-type(2)::before { content: "Item:"; }
            table td:nth-of-type(3)::before { content: "Size:"; }
            .qty-cell { position: absolute; right: 10px; top: 10px; font-size: 22px !important; }
            .qty-cell::before { content: ""; display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 QUẢN LÝ KHO</h2>
    
    <div class="search-box">
        <input type="text" id="itemInput" placeholder="Mã Item + Enter..." onkeypress="handleItemKeyPress(event)">
        <input type="text" id="sizeInput" placeholder="Lọc Size..." oninput="applyFilter()">
    </div>

    <div id="filterContainer" class="filter-box">
        <label style="font-weight: bold; color: #0056b3;">📍 Store:</label>
        <select id="storeFilter" onchange="applyFilter()">
            <option value="all">--- Tất cả ---</option>
        </select>
    </div>

    <div class="table-container">
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Store</th>
                    <th>ItemNo</th>
                    <th>Size</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4" style="color:#999; padding: 30px;">Gõ mã hàng và nhấn Enter</td></tr>
            </tbody>
        </table>
    </div>
    
    <div id="statusMessage" class="status">Sẵn sàng.</div>
</div>

<script>
let allData = []; // Lưu trữ dữ liệu gốc từ API

// Kiểm tra login
window.onload = function() {
    const token = localStorage.getItem('userToken');
    if (!token) window.location.href = 'login.html';
};

// Bắt sự kiện Enter ở ô Item
function handleItemKeyPress(event) {
    if (event.key === "Enter") {
        loadData();
    }
}

// 1. HÀM GỌI API (Chỉ chạy khi nhấn Enter ở ô Item)
async function loadData() {
    const token = localStorage.getItem('userToken');
    const itemNo = document.getElementById("itemInput").value.trim();
    const statusMsg = document.getElementById("statusMessage");

    if (itemNo.length < 3) {
        alert("Nhập ít nhất 3 ký tự mã hàng!");
        return;
    }

    statusMsg.innerHTML = '<span class="loading">🔄 Đang tải dữ liệu...</span>';
    
    try {
        const url = `https://api.vinh-lab-2026.online/api/inventory?itemNo=${encodeURIComponent(itemNo)}`;
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });

        if (res.status === 401) {
            alert("Hết hạn đăng nhập!");
            window.location.href = 'login.html';
            return;
        }

        const data = await res.json();
        allData = data; // Lưu dữ liệu mới vào biến tổng

        if (!data || data.length === 0) {
            renderTable([]);
            statusMsg.innerHTML = "❌ Không thấy hàng.";
            document.getElementById("filterContainer").style.display = "none";
        } else {
            updateStoreDropdown(data);
            // Sau khi có data mới, ta chạy applyFilter luôn để khớp với ô Size/Store hiện tại
            applyFilter();
            document.getElementById("filterContainer").style.display = "block";
        }
    } catch (err) {
        statusMsg.innerHTML = `<span style="color:red;">⚠️ Lỗi kết nối</span>`;
    }
}

// 2. HÀM CẬP NHẬT COMBOBOX STORE
function updateStoreDropdown(data) {
    const select = document.getElementById("storeFilter");
    const stores = [...new Set(data.map(item => item.store))].sort();
    select.innerHTML = '<option value="all">--- Tất cả ---</option>';
    stores.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = `Store: ${s}`;
        select.appendChild(opt);
    });
}

// 3. HÀM LỌC TỔNG HỢP (KẾT HỢP CẢ STORE VÀ SIZE)
function applyFilter() {
    const selectedStore = document.getElementById("storeFilter").value;
    const searchSize = document.getElementById("sizeInput").value.trim().toUpperCase();
    const statusMsg = document.getElementById("statusMessage");

    // Lọc dữ liệu dựa trên 2 điều kiện
    const filtered = allData.filter(item => {
        const matchStore = (selectedStore === "all" || item.store == selectedStore);
        // Kiểm tra xem Size trong data có chứa ký tự đang gõ không
        const matchSize = (searchSize === "" || item.size.toString().toUpperCase().includes(searchSize));
        
        return matchStore && matchSize;
    });

    renderTable(filtered);
    statusMsg.innerHTML = `✅ Đang hiển thị ${filtered.length} kết quả.`;
}

// 4. HÀM VẼ BẢNG
function renderTable(data) {
    const tbody = document.querySelector("#inventoryTable tbody");
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Không tìm thấy kết quả phù hợp</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(r => `
        <tr>
            <td>${r.store}</td>
            <td class="item-cell">${r.itemNo}</td>
            <td><span style="background:#eee; padding:2px 8px; border-radius:4px; font-weight:bold;">${r.size}</span></td>
            <td class="qty-cell">${r.qty}</td>
        </tr>
    `).join('');
}
</script>

</body>
</html>
