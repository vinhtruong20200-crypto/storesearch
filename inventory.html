<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tồn kho - Inventory System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #333; text-align: center; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* Khu vực tìm kiếm */
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        #itemInput { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; }
        #itemInput:focus { border-color: #007bff; }
        
        .btn-search { padding: 0 20px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-search:disabled { background-color: #ccc; }

        /* Khu vực lọc Store */
        .filter-box { background: #e9f2ff; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; /* Ẩn khi chưa có dữ liệu */ }
        #storeFilter { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #b6d4fe; font-size: 15px; margin-top: 5px; }

        /* Bảng dữ liệu tối ưu mobile */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th { background-color: #007bff; color: white; padding: 12px 8px; font-size: 13px; text-transform: uppercase; position: sticky; top: 0; }
        td { border-bottom: 1px solid #eee; padding: 12px 8px; font-size: 15px; text-align: center; }
        tr:nth-child(even) { background-color: #fafafa; }
        .qty-cell { font-weight: bold; color: #d32f2f; }
        .item-cell { font-weight: 600; color: #333; }

        .status { margin-top: 15px; font-size: 14px; text-align: center; color: #666; }
        .loading { color: #007bff; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 ST</h2>
    
    <div class="search-box">
        <input type="text" id="itemInput" placeholder="Nhập mã Item (ít nhất 3 ký tự)..." onkeypress="handleKeyPress(event)">
        <button id="btnSearch" class="btn-search" onclick="loadData()">TÌM KIẾM</button>
    </div>

    <div id="filterContainer" class="filter-box">
        <label style="font-weight: bold; color: #0056b3;">📍 Lọc nhanh theo Store:</label>
        <select id="storeFilter" onchange="applyFilter()">
            <option value="all">--- Tất cả cửa hàng ---</option>
        </select>
    </div>

    <div class="table-container">
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Store</th>
                    <th>ItemNo</th>
                    <th>Size</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4" style="color:#999; padding: 30px;">Nhập mã hàng để xem tồn kho</td></tr>
            </tbody>
        </table>
    </div>
    
    <div id="statusMessage" class="status">Sẵn sàng.</div>
</div>

<script>
let allData = []; // Biến lưu trữ toàn bộ dữ liệu gốc để lọc không cần gọi API lại

window.onload = function() {
    const token = localStorage.getItem('userToken');
    if (!token) {
        alert("Phiên làm việc hết hạn!");
        window.location.href = 'login.html';
    }
};

function handleKeyPress(event) {
    if (event.key === "Enter") loadData();
}

// 1. HÀM GỌI API
async function loadData() {
    const token = localStorage.getItem('userToken');
    const itemInput = document.getElementById("itemInput");
    const itemNo = itemInput.value.trim();
    const btn = document.getElementById("btnSearch");
    const statusMsg = document.getElementById("statusMessage");

    if (itemNo.length < 3) {
        alert("Vui lòng nhập ít nhất 3 ký tự nhé!");
        return;
    }

    // Giao diện lúc đang tải
    btn.disabled = true;
    statusMsg.innerHTML = '<span class="loading">🔄 Đang kiểm tra kho...</span>';
    
    try {
        const url = `https://api.vinh-lab-2026.online/api/inventory?itemNo=${encodeURIComponent(itemNo)}`;
        const res = await fetch(url, {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 401) {
            localStorage.removeItem('userToken');
            alert("Phiên đăng nhập hết hạn!");
            window.location.href = 'login.html';
            return;
        }

        if (!res.ok) throw new Error("Không kết nối được API.");

        const data = await res.json();
        allData = data; // Lưu dữ liệu vào biến toàn cục

        if (!data || data.length === 0) {
            renderTable([]);
            statusMsg.innerHTML = "❌ Không tìm thấy mã hàng này.";
            document.getElementById("filterContainer").style.display = "none";
        } else {
            updateStoreDropdown(data);
            renderTable(data);
            statusMsg.innerHTML = `✅ Tìm thấy ${data.length} dòng dữ liệu.`;
            document.getElementById("filterContainer").style.display = "block";
        }
    } catch (err) {
        statusMsg.innerHTML = `<span style="color:red;">⚠️ Lỗi: ${err.message}</span>`;
    } finally {
        btn.disabled = false;
    }
}

// 2. HÀM CẬP NHẬT DANH SÁCH STORE VÀO COMBOBOX
function updateStoreDropdown(data) {
    const select = document.getElementById("storeFilter");
    // Lấy danh sách Store duy nhất (Unique)
    const stores = [...new Set(data.map(item => item.store))].sort();
    
    select.innerHTML = '<option value="all">--- Tất cả cửa hàng ---</option>';
    stores.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = `Cửa hàng: ${s}`;
        select.appendChild(opt);
    });
}

// 3. HÀM LỌC DỮ LIỆU KHI CHỌN COMBOBOX
function applyFilter() {
    const selectedStore = document.getElementById("storeFilter").value;
    if (selectedStore === "all") {
        renderTable(allData);
    } else {
        const filtered = allData.filter(item => item.store == selectedStore);
        renderTable(filtered);
    }
}

// 4. HÀM VẼ BẢNG (Dùng chung cho cả tìm kiếm và lọc)
function renderTable(data) {
    const tbody = document.querySelector("#inventoryTable tbody");
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Không có dữ liệu</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(r => `
        <tr>
            <td>${r.store}</td>
            <td class="item-cell">${r.itemNo}</td>
            <td><span style="background:#eee; padding:2px 6px; border-radius:4px;">${r.size}</span></td>
            <td class="qty-cell">${r.qty}</td>
        </tr>
    `).join('');
}
</script>

</body>
</html>
