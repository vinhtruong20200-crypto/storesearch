<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tồn kho - Inventory System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #333; text-align: center; margin-bottom: 15px; font-size: 20px;}
        
        /* Layout 2 ô nhập liệu nằm ngang */
        .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; font-weight: bold; color: #007bff; margin-bottom: 4px; }
        
        input { padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; }
        #itemInput { border-color: #007bff; } /* Ô này là chính */
        #sizeInput { border-color: #ddd; }
        input:focus { border-color: #28a745 !important; background: #f0fff4; }

        /* Bảng dữ liệu */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background-color: #007bff; color: white; padding: 10px; font-size: 12px; text-transform: uppercase; }
        td { border-bottom: 1px solid #eee; padding: 12px 8px; font-size: 15px; text-align: center; }
        
        .qty-cell { font-weight: bold; color: #d32f2f; font-size: 18px !important; }
        .item-cell { font-weight: 600; color: #333; }
        .status { margin-top: 15px; font-size: 13px; text-align: center; color: #666; }

        /* Responsive Mobile - Giống như ảnh Vinh gửi */
        @media screen and (max-width: 600px) {
            table thead { display: none; }
            table tr { display: block; margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; padding: 10px; position: relative; background: white;}
            table td { display: block; text-align: left; padding: 4px 0; border: none; }
            table td::before { font-weight: bold; color: #888; margin-right: 5px; display: inline-block; width: 60px; }
            table td:nth-of-type(1)::before { content: "Store:"; }
            table td:nth-of-type(2)::before { content: "Item:"; }
            table td:nth-of-type(3)::before { content: "Size:"; }
            .qty-cell { position: absolute; right: 10px; top: 10px; color: #d32f2f; }
            .qty-cell::before { content: ""; display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 QUẢN LÝ TỒN KHO</h2>
    
    <div class="search-box">
        <div class="input-group" style="flex: 2;">
            <label>ITEM NO (Enter để tìm)</label>
            <input type="text" id="itemInput" placeholder="Nhập mã hàng..." onkeypress="handleItemKeyPress(event)">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>SIZE (Gõ để lọc)</label>
            <input type="text" id="sizeInput" placeholder="Size..." oninput="filterBySize()">
        </div>
    </div>

    <div class="table-container">
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Store</th>
                    <th>ItemNo</th>
                    <th>Size</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4" style="color:#999; padding: 30px;">Nhập mã ItemNo và nhấn Enter để lấy dữ liệu</td></tr>
            </tbody>
        </table>
    </div>
    
    <div id="statusMessage" class="status">Sẵn sàng.</div>
</div>

<script>
let allData = []; // Két sắt lưu dữ liệu gốc từ Database

// Tự động focus vào ô ItemNo khi load trang cho Vinh thao tác nhanh
window.onload = function() {
    const token = localStorage.getItem('userToken');
    if (!token) window.location.href = 'login.html';
    document.getElementById("itemInput").focus();
};

// 1. TRUY VẤN DATABASE (Chỉ chạy khi nhấn Enter ở ItemNo)
async function handleItemKeyPress(event) {
    if (event.key === "Enter") {
        const token = localStorage.getItem('userToken');
        const itemNo = document.getElementById("itemInput").value.trim();
        const statusMsg = document.getElementById("statusMessage");

        if (itemNo.length < 3) {
            alert("Vinh ơi, nhập ít nhất 3 ký tự mã hàng nhé!");
            return;
        }

        statusMsg.innerHTML = '<span style="color:#007bff; font-weight:bold;">🔄 Đang lấy danh sách từ Database...</span>';
        
        try {
            const url = `https://api.vinh-lab-2026.online/api/inventory?itemNo=${encodeURIComponent(itemNo)}`;
            const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });

            if (res.status === 401) {
                alert("Hết hạn đăng nhập!");
                window.location.href = 'login.html';
                return;
            }

            const data = await res.json();
            allData = data; // Cất dữ liệu vào két sắt

            // Sau khi lấy dữ liệu mới, xóa ô lọc Size và hiển thị bảng
            document.getElementById("sizeInput").value = ""; 
            renderTable(allData);
            statusMsg.innerHTML = `✅ Đã tải xong ${data.length} dòng. Gõ ô Size để lọc nhanh!`;

        } catch (err) {
            statusMsg.innerHTML = `<span style="color:red;">⚠️ Lỗi kết nối API</span>`;
        }
    }
}

// 2. LỌC TRÊN KẾT QUẢ CÓ SẴN (Không gọi Database)
function filterBySize() {
    const sizeKeyword = document.getElementById("sizeInput").value.trim().toUpperCase();
    
    // Nếu chưa có dữ liệu thì không làm gì cả
    if (allData.length === 0) return;

    // Lọc từ két sắt 'allData'
    const filteredResults = allData.filter(item => 
        item.size.toString().toUpperCase().includes(sizeKeyword)
    );

    renderTable(filteredResults);
    
    const statusMsg = document.getElementById("statusMessage");
    statusMsg.innerHTML = `🔎 Đang lọc Size: "${sizeKeyword}" - Tìm thấy ${filteredResults.length} kết quả.`;
}

// 3. HÀM VẼ BẢNG
function renderTable(data) {
    const tbody = document.querySelector("#inventoryTable tbody");
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Không tìm thấy dữ liệu phù hợp</td></tr>';
        return;
    }

    tbody.innerHTML = data.map(r => `
        <tr>
            <td>${r.store}</td>
            <td class="item-cell">${r.itemNo}</td>
            <td><span style="background:#eee; padding:2px 8px; border-radius:4px; font-weight:bold;">${r.size}</span></td>
            <td class="qty-cell">${r.qty}</td>
        </tr>
    `).join('');
}
</script>

</body>
</html>
