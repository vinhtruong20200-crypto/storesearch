<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Vinh Lab 2026</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); text-align: center; }
        
        .header { margin-bottom: 30px; }
        .header h2 { color: #1a73e8; margin: 0 0 10px 0; font-size: 24px; }
        .user-info { color: #5f6368; font-size: 15px; background: #f8fbff; padding: 10px; border-radius: 8px; border: 1px solid #c2e7ff; display: inline-block; }
        .user-info span { font-weight: bold; color: #1a73e8; }

        /* Lưới chứa các nút chức năng */
        .menu-grid { display: flex; flex-direction: column; gap: 15px; }

        .menu-card {
            background: #ffffff;
            border: 2px solid #dadce0;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #3c4043;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .menu-card:hover, .menu-card:active {
            border-color: #1a73e8;
            background: #f1f8ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26,115,232,0.15);
        }

        .menu-icon { font-size: 28px; }

        .btn-logout {
            margin-top: 30px;
            background-color: transparent;
            color: #d93025;
            border: 2px solid #d93025;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-logout:hover { background-color: #d93025; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Vinh Lab 2026</h2>
        <div class="user-info">
            Xin chào, <span id="lblFullName">---</span><br>
            Cửa hàng: <span id="lblStoreCode">---</span>
        </div>
    </div>

    <div class="menu-grid">
        <a href="inventory.html" class="menu-card">
            <span class="menu-icon">🔎</span>
            <span>Tra cứu Tồn kho</span>
        </a>

        <a href="shipment.html" class="menu-card">
            <span class="menu-icon">📦</span>
            <span>Xác nhận Nhận hàng</span>
        </a>
    </div>

    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
</div>

<script>
    // Kiểm tra đăng nhập và lấy thông tin hiển thị
    window.onload = () => {
        const token = localStorage.getItem('userToken');
        if (!token) {
            window.location.href = 'login.html'; // Nếu chưa đăng nhập thì đuổi về trang Login
            return;
        }

        // Lấy tên và mã cửa hàng từ LocalStorage (đã lưu lúc đăng nhập)
        const fullName = localStorage.getItem('fullName') || 'Nhân viên';
        const storeCode = localStorage.getItem('storeCode') || 'N/A';

        document.getElementById('lblFullName').innerText = fullName;
        document.getElementById('lblStoreCode').innerText = storeCode;
    };

    // Hàm đăng xuất
    function logout() {
        if(confirm("Bạn có chắc chắn muốn đăng xuất?")) {
            localStorage.clear(); // Xóa sạch token và dữ liệu trong két sắt
            window.location.href = 'login.html'; // Quay về trang đăng nhập
        }
    }
</script>

</body>
</html>
