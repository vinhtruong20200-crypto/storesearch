<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Vinh Lab 2026</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; background: white; padding: 30px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); text-align: center; }
        
        .header { margin-bottom: 30px; }
        .header h2 { color: #1a73e8; margin: 0 0 10px 0; font-size: 24px; }
        .user-info { color: #5f6368; font-size: 15px; background: #f8fbff; padding: 10px; border-radius: 8px; border: 1px solid #c2e7ff; display: inline-block; }
        .user-info span { font-weight: bold; color: #1a73e8; }

        /* Lưới chứa các nút chức năng */
        .menu-grid { display: flex; flex-direction: column; gap: 15px; }

        .menu-card {
            background: #ffffff;
            border: 2px solid #dadce0;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #3c4043;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .menu-card:hover, .menu-card:active {
            border-color: #1a73e8;
            background: #f1f8ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26,115,232,0.15);
        }

        .menu-icon { font-size: 28px; }

        .btn-logout {
            margin-top: 30px;
            background-color: transparent;
            color: #d93025;
            border: 2px solid #d93025;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-logout:hover { background-color: #d93025; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Vinh Lab 2026</h2>
        <div class="user-info">
            Xin chào, <span id="lblFullName">---</span><br>
            Cửa hàng: <span id="lblStoreCode">---</span>
        </div>
    </div>

    <div class="menu-grid">
        <a href="inventory.html" class="menu-card">
            <span class="menu-icon">🔎</span>
            <span>Stock On Hand</span>
        </a>

        <a href="shipment.html" class="menu-card">
            <span class="menu-icon">📦</span>
            <span>Confirm Shipment</span>
        </a>
    </div>

    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
</div>

<script>
    // Kiểm tra đăng nhập và lấy thông tin hiển thị
    window.onload = () => {
        const token = localStorage.getItem('inv_token');
        const sessionRaw = localStorage.getItem('inv_session');

        // 1. Kiểm tra "Thẻ bài" (Token) và "Gói dữ liệu" (Session)
        if (!token || !sessionRaw) {
            window.location.href = 'index.html'; // Nếu thiếu 1 trong 2 thì bắt đăng nhập lại
            return;
        }

        try {
            // 2. "Khui hộp" dữ liệu inv_session
            const sessionConfig = JSON.parse(sessionRaw);

            // 3. Lấy dữ liệu từ trong Object đã khui
            // Dùng dấu || để phòng hờ trường hợp dữ liệu bên trong bị trống
            const fullName = sessionConfig.displayName || "Nhân viên";
            const storeCode = sessionConfig.storeCode || "N/A";

            // 4. Hiển thị lên giao diện
            // Chú ý: Đảm bảo ID 'lblFullName' và 'lblStoreCode' có tồn tại trong HTML của bạn
            if(document.getElementById('lblFullName')) {
                document.getElementById('lblFullName').innerText = fullName;
            }
            if(document.getElementById('lblStoreCode')) {
                document.getElementById('lblStoreCode').innerText = storeCode;
            }

            console.log("Phiên làm việc của:", fullName, "tại kho:", storeCode);

        } catch (error) {
            console.error("Lỗi giải mã dữ liệu phiên làm việc:", error);
            // Nếu dữ liệu bị lỗi cấu hình, xóa đi và bắt đăng nhập lại cho sạch
            localStorage.removeItem('inv_session');
            window.location.href = 'index.html';
        }
    };

    // Hàm đăng xuất (Cập nhật để xóa đúng các Key mới)
    function logout() {
        if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
            // 1. Xóa các thông tin phiên làm việc mới
            localStorage.removeItem('inv_token');
            localStorage.removeItem('inv_session');
            
            // 2. (Tùy chọn) Xóa nốt các tàn dư cũ nếu còn
            localStorage.removeItem('userName');
            localStorage.removeItem('fullName');
            localStorage.removeItem('storeCode');
            localStorage.removeItem('StoreCode');

            // 3. Thông báo và chuyển hướng
            alert("Đã đăng xuất thành công!");
            window.location.href = "index.html";
        }
    }
</script>

</body>
</html>
